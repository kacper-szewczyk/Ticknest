name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml to check the release PR, which GitHub does not run CI on
  # because release-please opens it with GITHUB_TOKEN.
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to check (defaults to the triggering ref).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint app
        run: npm run lint
      - name: Typecheck app
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build app
        run: npm run build

  functions:
    name: Functions lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Lint Functions
        run: npm run lint:functions
      - name: Typecheck Functions
        run: npm run typecheck:functions

  emulator-tests:
    name: Firestore rules and Functions tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # The Firestore emulator runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run Firestore rules and Functions tests
        run: npm run test:emulators

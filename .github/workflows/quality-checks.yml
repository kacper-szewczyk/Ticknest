name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml to check the release PR, which GitHub does not run CI on
  # because release-please opens it with GITHUB_TOKEN.
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to check (defaults to the triggering ref).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint app
        run: npm run lint
      - name: Typecheck app
        run: npm run typecheck
      - name: Build app
        run: npm run build

  functions:
    name: Functions lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Lint Functions
        run: npm run lint:functions
      - name: Typecheck Functions
        run: npm run typecheck:functions

name: Release

on:
  push:
    branches: [main]

# One release run at a time, so two quick merges cannot race to merge or tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR is opened with GITHUB_TOKEN, which never triggers CI, so check it here.
  check-release-pr:
    name: Check release PR
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    permissions:
      contents: read
    uses: ./.github/workflows/quality-checks.yml
    with:
      ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

  merge-release-pr:
    name: Merge release PR
    needs: [release-please, check-release-pr]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Squash-merge the release PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          gh pr merge "$PR" --squash --repo "$GITHUB_REPOSITORY"
          echo "sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"

  # A merge made with GITHUB_TOKEN does not trigger a new push run, so tag and publish the
  # release from this run.
  publish-release:
    name: Publish release
    needs: merge-release-pr
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The merge above does not trigger the push run that deploy.yml follows, so deploy the release
  # commit from here. The deploy job skips itself unless deploys are configured.
  deploy:
    name: Deploy release
    needs: [merge-release-pr, publish-release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.merge-release-pr.outputs.sha }}

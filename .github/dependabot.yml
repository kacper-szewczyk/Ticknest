version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # PR titles must be Conventional Commits (see pr-title.yml).
    commit-message:
      prefix: chore
    ignore:
      # Types must match the Node runtime in .nvmrc, so bump majors by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      app-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      functions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
